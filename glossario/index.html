<style>

  .c-alt { font-size: .62em; font-weight: 500; color: var(--muted); font-style: italic; white-space: nowrap; }

  @media (max-width: 640px) { h1 { font-size: 20px; } #card { padding: 18px 18px 20px; } .c-name { font-size: 26px; } .c-def { font-size: 18px; } }

{ const seen = new Set();
