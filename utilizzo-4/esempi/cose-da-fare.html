<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cose da fare</title>
<style>
  body { font-family: "Segoe UI", system-ui, Arial, sans-serif; background: #f4f6f8; color: #1b2733; margin: 0; }
  main { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 14px; padding: 24px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }
  h1 { margin: 0 0 16px; font-size: 26px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; font-size: 17px; padding: 10px 12px; border: 1px solid #c8d1da; border-radius: 8px; }
  button { font-size: 16px; padding: 10px 14px; border: 0; border-radius: 8px; background: #0e9f8e; color: #fff; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 18px 0 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #eef1f4; font-size: 17px; }
  li span { flex: 1; }
  li.fatta span { text-decoration: line-through; color: #8a98a6; }
  li input { width: 20px; height: 20px; }
  li button { background: none; color: #b0413e; padding: 4px 8px; font-size: 15px; }
  .vuoto { color: #8a98a6; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Cose da fare</h1>
  <form id="modulo">
    <input type="text" id="testo" placeholder="Scrivi una cosa da fare" autocomplete="off">
    <button type="submit">Aggiungi</button>
  </form>
  <ul id="elenco"></ul>
  <p class="vuoto" id="vuoto">Nessuna cosa da fare.</p>
</main>
<script>
  var CHIAVE = 'cose-da-fare';
  var cose = JSON.parse(localStorage.getItem(CHIAVE) || '[]');

  function salva() { localStorage.setItem(CHIAVE, JSON.stringify(cose)); }

  function mostra() {
    var elenco = document.getElementById('elenco');
    elenco.innerHTML = '';
    cose.forEach(function (cosa, i) {
      var li = document.createElement('li');
      if (cosa.fatta) li.className = 'fatta';
      var casella = document.createElement('input');
      casella.type = 'checkbox';
      casella.checked = cosa.fatta;
      casella.addEventListener('change', function () { cosa.fatta = casella.checked; salva(); mostra(); });
      var testo = document.createElement('span');
      testo.textContent = cosa.testo;
      var elimina = document.createElement('button');
      elimina.textContent = 'Elimina';
      elimina.addEventListener('click', function () { cose.splice(i, 1); salva(); mostra(); });
      li.append(casella, testo, elimina);
      elenco.appendChild(li);
    });
    document.getElementById('vuoto').style.display = cose.length ? 'none' : 'block';
  }

  document.getElementById('modulo').addEventListener('submit', function (e) {
    e.preventDefault();
    var campo = document.getElementById('testo');
    var t = campo.value.trim();
    if (t) { cose.push({ testo: t, fatta: false }); salva(); mostra(); }
    campo.value = '';
    campo.focus();
  });

  mostra();
</script>
</body>
</html>
